apiVersion: v1
kind: PersistentVolumeClaim        # Create a PersistentVolumeClaim; the cluster's default StorageClass
metadata:                          # dynamically provisions the backing volume (e.g. EBS/PD/Disk on a
  name: mysql-pv-claim              # managed cluster), so storage follows the pod across nodes.
  labels:
    app: mysql-app
spec:                              # Access mode and resource limits
  accessModes:
    - ReadWriteOnce                # ReadWriteOnce means the volume can be mounted as read-write by a single Node
  resources:
    requests:
      storage: 250Mi
---
apiVersion: v1                    # API version
kind: Service                     # Type of kubernetes resource 
metadata:
  name: app-mysql         # Name of the resource
  labels:                         # Labels that will be applied to the resource
    app: mysql-app
spec:
  ports:
    - port: 3306
  selector:                       # Selects any Pod with labels `app=mysql-app,tier=mysql`
    app: mysql-app
    tier: mysql
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment                    # Type of the kubernetes resource
metadata:
  name: app-mysql           # Name of the deployment
  labels:                           # Labels applied to this deployment 
    app: mysql-app
spec:
  selector:
    matchLabels:                    # This deployment applies to the Pods matching the specified labels
      app: mysql-app
      tier: mysql
  strategy:
    type: Recreate
  template:                         # Template for the Pods in this deployment
    metadata:
      labels:                       # Labels to be applied to the Pods in this deployment
        app: mysql-app
        tier: mysql
    spec:                           # The spec for the containers that will be run inside the Pods in this deployment
      containers:
      - image: mysql:5.7            # The container image
        name: mysql
        env:                        # Environment variables passed to the container
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          value : devopsDB
        ports:
        - containerPort: 3306        # The port that the container exposes       
          name: mysql
        volumeMounts:
        - name: mysql-persistent-storage  # This name should match the name specified in `volumes.name`
          mountPath: /var/lib/mysql
      volumes:                       # A PersistentVolume is mounted as a volume to the Pod  
      - name: mysql-persistent-storage
        persistentVolumeClaim:
          claimName: mysql-pv-claim
