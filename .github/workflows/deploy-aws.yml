name: Deploy to AWS

on:
  push:
    branches:
      - master

  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Docker Compose stack

    runs-on:
      - self-hosted
      - Linux
      - X64

    environment: production
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show deployment information
        shell: bash
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "User: $(whoami)"
          echo "Host: $(hostname)"

      - name: Check Docker
        shell: bash
        run: |
          set -Eeuo pipefail

          docker --version
          docker compose version
          docker info

      - name: Validate Docker Compose
        shell: bash
        run: |
          set -Eeuo pipefail

          docker compose \
            --file docker-compose.yml \
            config

      - name: Build and deploy application
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Deploying commit: $GITHUB_SHA"

          docker compose \
            --project-name devops-team \
            --file docker-compose.yml \
            up \
            --detach \
            --build \
            --remove-orphans

      - name: Show containers
        shell: bash
        run: |
          docker compose \
            --project-name devops-team \
            --file docker-compose.yml \
            ps

      - name: Health check
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Waiting for frontend..."

          for attempt in {1..18}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://localhost:4200/ \
              >/dev/null; then

              echo "===================================="
              echo "Deployment successful"
              echo "Frontend: http://35.180.252.79:4200"
              echo "Backend:  http://35.180.252.79:8089"
              echo "Portainer: http://35.180.252.79:9001"
              echo "===================================="

              exit 0
            fi

            echo "Waiting for application ($attempt/18)..."
            sleep 10
          done

          echo "Application did not become healthy."

          docker compose \
            --project-name devops-team \
            --file docker-compose.yml \
            ps

          echo "===== Backend logs ====="

          docker compose \
            --project-name devops-team \
            --file docker-compose.yml \
            logs \
            --tail=200 \
            app-server

          echo "===== Frontend logs ====="

          docker compose \
            --project-name devops-team \
            --file docker-compose.yml \
            logs \
            --tail=200 \
            app-client

          echo "===== MySQL logs ====="

          docker compose \
            --project-name devops-team \
            --file docker-compose.yml \
            logs \
            --tail=100 \
            mysqldb

          exit 1