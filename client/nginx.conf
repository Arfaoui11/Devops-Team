server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The browser calls /SpringMVC on localhost:4200. Nginx forwards the
    # request to the backend by its Docker Compose service name.
    location = /SpringMVC {
        return 301 /SpringMVC/;
    }

    location /SpringMVC/ {
        proxy_pass http://app-server:8089;
        proxy_http_version 1.1;
        # $http_host preserves the public port (for example :4200). Spring
        # needs it to recognize the browser Origin as the same origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
    }

    # Angular routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
